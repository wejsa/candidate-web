services:
  db:
    image: postgres:16-alpine
    container_name: candidate-web-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: candidate_web
      POSTGRES_USER: candidate
      POSTGRES_PASSWORD: candidate
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U candidate -d candidate_web']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
