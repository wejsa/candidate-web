services:
  db:
    image: postgres:16-alpine
    container_name: candidate-web-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: candidate_web
      POSTGRES_USER: candidate
      POSTGRES_PASSWORD: candidate
    ports:
      # localhost 전용 바인딩 — 동일 LAN(공용 Wi-Fi 등)에서 dev DB 접근 차단.
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U candidate -d candidate_web']
      interval: 5s
      timeout: 5s
      retries: 10

  # CANDID-016: 이력서 첨부용 S3 호환 객체 스토리지 (dev 전용).
  # 운영은 관리형 S3 — minio는 dev/integration 테스트 전용.
  # 자격증명은 .env.example의 S3_ACCESS_KEY/SECRET_KEY와 정합 필수.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: candidate-web-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: candidate
      MINIO_ROOT_PASSWORD: candidate-dev-secret
    ports:
      # localhost 전용 바인딩 — LAN에서 dev 객체 스토리지 노출 차단.
      - '127.0.0.1:9000:9000' # S3 API
      - '127.0.0.1:9001:9001' # Console UI
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  # minio 부팅 후 1회성 init — 버킷 생성 + 익명 접근 차단 + 정상 종료.
  # presigned URL은 호출 시 임시 자격증명을 포함하므로 anonymous policy 불필요.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: candidate-web-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 candidate candidate-dev-secret &&
      mc mb --ignore-existing local/candidate-web-resumes &&
      mc anonymous set none local/candidate-web-resumes &&
      echo 'minio init done'
      "
    restart: 'no'

volumes:
  pgdata:
  miniodata:
